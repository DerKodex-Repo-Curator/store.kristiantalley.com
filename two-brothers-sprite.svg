<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 80" width="256" height="320">
  <!-- 8-bit Sprite: Two Brothers in Garden -->
  <!-- Color Palette: Muted greens, pinks, browns from original -->

  <defs>
    <style>
      .bg { fill: #d4b8a8; }
      .sky { fill: #c9a8b8; }
      .grass { fill: #7a8a5a; }
      .grass-light { fill: #9aaa7a; }
      .skin { fill: #8a7a6a; }
      .skin-light { fill: #b8a898; }
      .hair { fill: #4a4a3a; }
      .shirt1 { fill: #5a6a5a; }
      .shirt2 { fill: #6a5a4a; }
      .plant { fill: #e8e8d8; }
      .plant-stem { fill: #c8c8b8; }
      .outline { fill: #3a3a2a; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="sky" x="0" y="0" width="64" height="50"/>
  <rect class="bg" x="0" y="50" width="64" height="30"/>

  <!-- Grass patches -->
  <rect class="grass" x="0" y="60" width="64" height="20"/>
  <rect class="grass-light" x="4" y="62" width="4" height="4"/>
  <rect class="grass-light" x="20" y="66" width="6" height="4"/>
  <rect class="grass-light" x="48" y="64" width="4" height="4"/>

  <!-- Plant left top (flower/bush) -->
  <rect class="plant-stem" x="8" y="8" width="2" height="16"/>
  <rect class="plant" x="4" y="4" width="4" height="4"/>
  <rect class="plant" x="10" y="2" width="4" height="4"/>
  <rect class="plant" x="6" y="8" width="6" height="4"/>
  <rect class="plant" x="4" y="12" width="4" height="2"/>
  <rect class="plant" x="12" y="10" width="4" height="4"/>

  <!-- Plant right (small branch) -->
  <rect class="plant-stem" x="52" y="20" width="2" height="8"/>
  <rect class="plant" x="50" y="16" width="4" height="4"/>
  <rect class="plant" x="54" y="18" width="4" height="4"/>
  <rect class="plant" x="48" y="22" width="4" height="2"/>

  <!-- Small plant bottom right -->
  <rect class="plant-stem" x="44" y="52" width="2" height="10"/>
  <rect class="plant" x="42" y="48" width="2" height="4"/>
  <rect class="plant" x="46" y="50" width="2" height="4"/>
  <rect class="plant" x="40" y="54" width="2" height="2"/>
  <rect class="plant" x="48" y="52" width="2" height="2"/>
  <rect class="plant" x="44" y="56" width="2" height="2"/>

  <!-- Brother 1 (left, lighter skin, holding plant) -->
  <!-- Hair -->
  <rect class="hair" x="14" y="18" width="10" height="6"/>
  <rect class="hair" x="12" y="20" width="2" height="4"/>
  <rect class="hair" x="24" y="20" width="2" height="4"/>

  <!-- Head -->
  <rect class="skin-light" x="14" y="24" width="10" height="10"/>
  <rect class="outline" x="16" y="28" width="2" height="2"/>
  <rect class="outline" x="20" y="28" width="2" height="2"/>
  <rect class="outline" x="17" y="32" width="4" height="1"/>

  <!-- Body -->
  <rect class="shirt1" x="12" y="34" width="14" height="16"/>
  <rect class="shirt1" x="10" y="36" width="2" height="12"/>
  <rect class="shirt1" x="26" y="36" width="2" height="8"/>

  <!-- Arm holding plant -->
  <rect class="skin-light" x="6" y="32" width="4" height="2"/>
  <rect class="skin-light" x="4" y="28" width="4" height="4"/>
  <rect class="skin-light" x="8" y="34" width="2" height="4"/>

  <!-- Plant being held -->
  <rect class="plant-stem" x="4" y="16" width="2" height="12"/>
  <rect class="plant" x="0" y="10" width="4" height="4"/>
  <rect class="plant" x="4" y="8" width="4" height="4"/>
  <rect class="plant" x="2" y="14" width="6" height="4"/>
  <rect class="plant" x="6" y="12" width="4" height="4"/>

  <!-- Legs -->
  <rect class="hair" x="14" y="50" width="4" height="10"/>
  <rect class="hair" x="20" y="50" width="4" height="10"/>

  <!-- Brother 2 (right, darker, looking down) -->
  <!-- Hair -->
  <rect class="hair" x="36" y="14" width="12" height="8"/>
  <rect class="hair" x="34" y="16" width="2" height="6"/>
  <rect class="hair" x="48" y="16" width="2" height="6"/>
  <rect class="hair" x="38" y="12" width="4" height="2"/>
  <rect class="hair" x="44" y="12" width="4" height="2"/>

  <!-- Head (slightly tilted/looking down) -->
  <rect class="skin" x="36" y="22" width="12" height="12"/>
  <rect class="skin" x="38" y="34" width="8" height="2"/>

  <!-- Face features (eyes closed, looking down) -->
  <rect class="outline" x="38" y="26" width="3" height="1"/>
  <rect class="outline" x="43" y="26" width="3" height="1"/>
  <rect class="outline" x="41" y="30" width="2" height="2"/>
  <rect class="outline" x="40" y="33" width="4" height="1"/>

  <!-- Body -->
  <rect class="shirt2" x="34" y="36" width="16" height="18"/>
  <rect class="shirt2" x="32" y="38" width="2" height="14"/>
  <rect class="shirt2" x="50" y="38" width="2" height="10"/>

  <!-- Arms -->
  <rect class="skin" x="30" y="40" width="2" height="8"/>
  <rect class="skin" x="52" y="40" width="2" height="6"/>

  <!-- Legs -->
  <rect class="hair" x="36" y="54" width="5" height="12"/>
  <rect class="hair" x="43" y="54" width="5" height="12"/>

  <!-- Highlights (white paint strokes from original) -->
  <rect class="plant" x="16" y="26" width="1" height="2" opacity="0.6"/>
  <rect class="plant" x="22" y="26" width="1" height="2" opacity="0.6"/>
  <rect class="plant" x="38" y="24" width="1" height="2" opacity="0.4"/>
  <rect class="plant" x="46" y="24" width="1" height="2" opacity="0.4"/>
</svg>
