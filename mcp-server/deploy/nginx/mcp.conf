# Nginx configuration for MCP Server reverse proxy
# Include this in your main nginx config or llm.kristiantalley.com server block
#
# In main nginx.conf:
#   http {
#     include /etc/nginx/conf.d/mcp.conf;
#   }

upstream mcp_server {
  server localhost:3001;
  keepalive 32;
}

# MCP Store endpoint
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name llm.kristiantalley.com;

  # SSL certificates (use certbot for Let's Encrypt)
  ssl_certificate /etc/letsencrypt/live/llm.kristiantalley.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/llm.kristiantalley.com/privkey.pem;

  # Security headers
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-XSS-Protection "1; mode=block" always;

  # CORS headers for AI client access
  add_header Access-Control-Allow-Origin "*" always;
  add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
  add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

  # Preflight requests
  if ($request_method = 'OPTIONS') {
    return 204;
  }

  # MCP endpoints — covers /mcp/store (tool calls) and /mcp/tools (tool list)
  location /mcp/ {
    proxy_pass http://mcp_server;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Buffering
    proxy_buffering off;
    proxy_request_buffering off;
  }

  # Stripe checkout — browser POSTs the cart, gets a hosted checkout URL back
  location = /checkout {
    proxy_pass http://mcp_server;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Stripe webhook — server-to-server from Stripe. Pass the raw body through
  # UNCHANGED (signature verification depends on the exact bytes).
  location = /webhook {
    proxy_pass http://mcp_server;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_request_buffering off;
  }

  # Health check endpoint
  location /health {
    proxy_pass http://mcp_server;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    access_log off;
  }

  # Root redirect
  location / {
    return 301 https://kristiantalley.com$request_uri;
  }

  # Deny access to sensitive files
  location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
  }
}

# HTTP redirect to HTTPS
server {
  listen 80;
  listen [::]:80;
  server_name llm.kristiantalley.com;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$server_name$request_uri;
  }
}
